name: Build PIFuHDC 3D Viewer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-37.0|build-tools;36.0.0" || true

      - name: Verify real MainActivity
        run: |
          test -f \
            app/src/main/java/com/pifuhdc/viewer/MainActivity.kt

          echo "Real MainActivity found."
          wc -l \
            app/src/main/java/com/pifuhdc/viewer/MainActivity.kt

      - name: Remove stale local Filament AARs
        run: |
          rm -f app/libs/filament.aar
          rm -f app/libs/gltfio.aar
          rm -f app/libs/filament-utils-api.aar

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.5.1

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Show project configuration
        run: |
          echo "===== settings.gradle.kts ====="
          cat settings.gradle.kts

          echo "===== build.gradle.kts ====="
          cat build.gradle.kts

          echo "===== app/build.gradle.kts ====="
          cat app/build.gradle.kts

      - name: Check Gradle configuration
        run: |
          ./gradlew \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon

      - name: Clean project
        run: |
          ./gradlew clean --no-daemon

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        run: |
          echo "===== APK OUTPUT ====="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

          test -f \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PIFuHDC-3D-Viewer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
