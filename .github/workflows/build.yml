name: Build PIFuHDC 3D Viewer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-37.0|build-tools;36.0.0" || true

      - name: Download Filament 1.77.0 AARs
        run: |
          mkdir -p app/libs

          curl -L --fail --retry 3 \
            "https://repo1.maven.org/maven2/com/google/android/filament/filament-android/1.77.0/filament-android-1.77.0.aar" \
            -o app/libs/filament.aar

          curl -L --fail --retry 3 \
            "https://repo1.maven.org/maven2/com/google/android/filament/gltfio-android/1.77.0/gltfio-android-1.77.0.aar" \
            -o app/libs/gltfio.aar

          curl -L --fail --retry 3 \
            "https://repo1.maven.org/maven2/com/google/android/filament/filament-utils-android/1.77.0/filament-utils-android-1.77.0.aar" \
            -o app/libs/filament-utils-api.aar

      - name: Verify Filament files
        run: |
          ls -lh app/libs/

          test -s app/libs/filament.aar
          test -s app/libs/gltfio.aar
          test -s app/libs/filament-utils-api.aar

      - name: Verify real MainActivity exists
        run: |
          test -f app/src/main/java/com/pifuhdc/viewer/MainActivity.kt

          echo "Real MainActivity found:"
          wc -l app/src/main/java/com/pifuhdc/viewer/MainActivity.kt

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.5.1

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Show project configuration
        run: |
          echo "=== Root build.gradle.kts ==="
          cat build.gradle.kts

          echo "=== App build.gradle.kts ==="
          cat app/build.gradle.kts

          echo "=== MainActivity.kt ==="
          sed -n '1,260p' \
            app/src/main/java/com/pifuhdc/viewer/MainActivity.kt

      - name: Clean project
        run: |
          ./gradlew clean --no-daemon

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PIFuHDC-3D-Viewer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
