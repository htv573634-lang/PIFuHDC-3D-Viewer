name: Bootstrap 6 - SceneView Compatibility Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sceneview-analysis:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT OUR PROJECT
      # ============================================================

      - name: Checkout PIFuHDC-3D-Viewer
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON
      # ============================================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install report generator
        run: |
          python -m pip install --upgrade pip
          pip install python-docx


      # ============================================================
      # 4. DOWNLOAD EXACT SCENEVIEW SOURCE
      # ============================================================

      - name: Clone SceneView 4.37.0
        run: |
          set -e

          mkdir -p analysis/sceneview

          git clone \
            --depth 1 \
            --branch v4.37.0 \
            https://github.com/SceneView/sceneview.git \
            analysis/sceneview/source

          cd analysis/sceneview/source

          echo "SceneView commit:"
          git rev-parse HEAD

          echo
          echo "SceneView tag:"
          git describe --tags --always


      # ============================================================
      # 5. VERIFY SCENEVIEW MAVEN ARTIFACT
      # ============================================================

      - name: Verify SceneView Maven artifacts
        run: |
          set -e

          mkdir -p analysis/maven

          BASE="https://repo1.maven.org/maven2/io/github/sceneview"

          echo "Checking sceneview..."
          curl -I \
            --fail \
            --silent \
            --show-error \
            "$BASE/sceneview/4.37.0/sceneview-4.37.0.aar"

          echo
          echo "Checking sceneview-core..."
          curl -I \
            --fail \
            --silent \
            --show-error \
            "$BASE/sceneview-core/4.37.0/sceneview-core-4.37.0.pom"

          echo
          echo "Downloading POM files..."

          curl -L \
            --fail \
            --retry 3 \
            -o analysis/maven/sceneview-4.37.0.pom \
            "$BASE/sceneview/4.37.0/sceneview-4.37.0.pom"

          curl -L \
            --fail \
            --retry 3 \
            -o analysis/maven/sceneview-core-4.37.0.pom \
            "$BASE/sceneview-core/4.37.0/sceneview-core-4.37.0.pom"

          echo
          echo "SceneView POM:"
          cat analysis/maven/sceneview-4.37.0.pom

          echo
          echo "SceneView Core POM:"
          cat analysis/maven/sceneview-core-4.37.0.pom


      # ============================================================
      # 6. INSPECT CURRENT PROJECT
      # ============================================================

      - name: Snapshot current project
        run: |
          set -e

          mkdir -p analysis/project

          {
            echo "============================================================"
            echo "PROJECT TREE"
            echo "============================================================"

            find app/src/main \
              -type f \
              | sort

            echo
            echo "============================================================"
            echo "APP BUILD GRADLE"
            echo "============================================================"

            nl -ba app/build.gradle.kts

            echo
            echo "============================================================"
            echo "ROOT BUILD GRADLE"
            echo "============================================================"

            nl -ba build.gradle.kts

            echo
            echo "============================================================"
            echo "SETTINGS"
            echo "============================================================"

            nl -ba settings.gradle.kts

            echo
            echo "============================================================"
            echo "GRADLE PROPERTIES"
            echo "============================================================"

            nl -ba gradle.properties

            echo
            echo "============================================================"
            echo "MANIFEST"
            echo "============================================================"

            nl -ba app/src/main/AndroidManifest.xml

          } > analysis/project/current_project.txt

          cat analysis/project/current_project.txt


      # ============================================================
      # 7. INSPECT CURRENT KOTLIN / XML SOURCE
      # ============================================================

      - name: Snapshot Android source
        run: |
          set -e

          mkdir -p analysis/project/source

          find app/src/main \
            -type f \
            \( \
              -name "*.kt" -o \
              -name "*.java" -o \
              -name "*.xml" \
            \) \
            -print \
            | sort \
            > analysis/project/source/file_list.txt

          while IFS= read -r file; do

            echo
            echo "============================================================"
            echo "FILE: $file"
            echo "============================================================"

            nl -ba "$file"

          done < analysis/project/source/file_list.txt \
            > analysis/project/source/all_source.txt


      # ============================================================
      # 8. SEARCH CURRENT FILAMENT / GLB IMPLEMENTATION
      # ============================================================

      - name: Analyze current GLB renderer
        run: |
          set -e

          {
            echo "CURRENT GLB / FILAMENT API USAGE"
            echo "================================"
            echo

            grep -R \
              -n \
              -E \
              "ModelViewer|Utils\.init|loadModelGlb|transformToUnitCube|FilamentAsset|AssetLoader|ResourceLoader|Engine|Renderer|SwapChain|Scene|Camera|TextureView|Surface|Choreographer" \
              app/src/main \
              2>/dev/null \
              || true

          } > analysis/project/current_renderer_usage.txt

          cat analysis/project/current_renderer_usage.txt


      # ============================================================
      # 9. INSPECT SCENEVIEW SOURCE TREE
      # ============================================================

      - name: Inspect SceneView source
        run: |
          set -e

          mkdir -p analysis/sceneview/inspection

          find analysis/sceneview/source \
            -type f \
            | sort \
            > analysis/sceneview/inspection/tree.txt


      # ============================================================
      # 10. SCENEVIEW BUILD CONFIGURATION
      # ============================================================

      - name: Analyze SceneView dependencies
        run: |
          set -e

          {
            echo "SCENEVIEW BUILD / DEPENDENCY CONFIGURATION"
            echo "==========================================="
            echo

            find analysis/sceneview/source \
              -type f \
              \( \
                -name "*.gradle" -o \
                -name "*.gradle.kts" -o \
                -name "*.toml" -o \
                -name "*.properties" \
              \) \
              -print \
              | sort

            echo
            echo "------------------------------------------------------------"
            echo "FILAMENT REFERENCES"
            echo "------------------------------------------------------------"

            grep -R \
              -n \
              -E \
              "filament|gltfio|filament-utils|kotlin-math|compose-bom|compileSdk|minSdk|targetSdk|kotlin" \
              analysis/sceneview/source \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              --include="*.toml" \
              --include="*.properties" \
              2>/dev/null \
              | head -n 10000 \
              || true

          } > analysis/sceneview/inspection/build_config.txt

          cat analysis/sceneview/inspection/build_config.txt


      # ============================================================
      # 11. FIND SCENEVIEW GLB LOADING CODE
      # ============================================================

      - name: Analyze SceneView GLB loading
        run: |
          set -e

          {
            echo "SCENEVIEW GLB LOADING"
            echo "===================="
            echo

            grep -R \
              -n \
              -E \
              "rememberModelInstance|ModelLoader|ModelNode|loadModelGlb|loadModelGltf|createModelInstance|loadModel" \
              analysis/sceneview/source \
              --include="*.kt" \
              --include="*.java" \
              2>/dev/null \
              | head -n 10000 \
              || true

          } > analysis/sceneview/inspection/glb_loading.txt

          cat analysis/sceneview/inspection/glb_loading.txt


      # ============================================================
      # 12. FIND SCENEVIEW RENDERING CODE
      # ============================================================

      - name: Analyze SceneView renderer
        run: |
          set -e

          {
            echo "SCENEVIEW RENDERING IMPLEMENTATION"
            echo "================================="
            echo

            grep -R \
              -n \
              -E \
              "class SceneView|fun SceneView|rememberEngine|Engine|Renderer|SwapChain|View|Scene|Camera|SurfaceView|TextureView|Choreographer" \
              analysis/sceneview/source \
              --include="*.kt" \
              --include="*.java" \
              2>/dev/null \
              | head -n 15000 \
              || true

          } > analysis/sceneview/inspection/rendering.txt

          cat analysis/sceneview/inspection/rendering.txt


      # ============================================================
      # 13. CAMERA / GESTURE SUPPORT
      # ============================================================

      - name: Analyze camera and gestures
        run: |
          set -e

          {
            echo "SCENEVIEW CAMERA / GESTURE SUPPORT"
            echo "================================="
            echo

            grep -R \
              -n \
              -E \
              "CameraManipulator|DefaultCameraManipulator|rememberCameraManipulator|zoom|pan|orbit|gesture|Gesture|onTouch|doubleTap|pinch|rotation" \
              analysis/sceneview/source \
              --include="*.kt" \
              --include="*.java" \
              2>/dev/null \
              | head -n 15000 \
              || true

          } > analysis/sceneview/inspection/camera_gestures.txt


      # ============================================================
      # 14. WORKING SCENEVIEW EXAMPLES
      # ============================================================

      - name: Find SceneView model examples
        run: |
          set -e

          {
            echo "SCENEVIEW MODEL EXAMPLES"
            echo "======================="
            echo

            grep -R \
              -n \
              -E \
              "\.glb|\.gltf|rememberModelInstance|ModelNode|SceneView\s*\{" \
              analysis/sceneview/source \
              --include="*.kt" \
              --include="*.java" \
              2>/dev/null \
              | head -n 15000 \
              || true

          } > analysis/sceneview/inspection/examples.txt

          cat analysis/sceneview/inspection/examples.txt


      # ============================================================
      # 15. COMPOSE REQUIREMENTS
      # ============================================================

      - name: Analyze Compose requirements
        run: |
          set -e

          {
            echo "SCENEVIEW COMPOSE REQUIREMENTS"
            echo "============================="
            echo

            grep -R \
              -n \
              -E \
              "androidx.compose|compose-bom|@Composable|Compose" \
              analysis/sceneview/source \
              --include="*.kt" \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              --include="*.toml" \
              2>/dev/null \
              | head -n 15000 \
              || true

          } > analysis/sceneview/inspection/compose.txt

          cat analysis/sceneview/inspection/compose.txt


      # ============================================================
      # 16. NATIVE ABI ANALYSIS
      # ============================================================

      - name: Analyze SceneView native libraries
        run: |
          set -e

          {
            echo "SCENEVIEW NATIVE / ABI REFERENCES"
            echo "================================"
            echo

            grep -R \
              -n \
              -E \
              "arm64-v8a|armeabi-v7a|x86_64|jniLibs|\.so|filament-android" \
              analysis/sceneview/source \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              --include="*.xml" \
              --include="*.properties" \
              2>/dev/null \
              | head -n 10000 \
              || true

          } > analysis/sceneview/inspection/native.txt

          cat analysis/sceneview/inspection/native.txt


      # ============================================================
      # 17. GRADLE DEPENDENCY GRAPH
      # ============================================================

      - name: Resolve current Gradle dependencies
        run: |
          set +e

          mkdir -p analysis/project

          if [ -x "./gradlew" ]; then

            ./gradlew \
              :app:dependencies \
              --configuration debugRuntimeClasspath \
              > analysis/project/dependency_graph.txt \
              2>&1

            STATUS=$?

            echo
            echo "Gradle dependency command exit code: $STATUS"

          else

            echo "Gradle wrapper not found." \
              > analysis/project/dependency_graph.txt

          fi

          cat analysis/project/dependency_graph.txt

          exit 0


      # ============================================================
      # 18. TEST SCENEVIEW ARTIFACT RESOLUTION
      # ============================================================

      - name: Create isolated SceneView dependency test
        run: |
          set -e

          mkdir -p analysis/isolated-gradle

          cat > analysis/isolated-gradle/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SceneViewDependencyProbe"

          include(":probe")
          EOF

          mkdir -p analysis/isolated-gradle/probe

          cat > analysis/isolated-gradle/probe/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.library") version "9.3.3"
          }

          android {
              namespace = "com.pifuhdc.sceneview.probe"

              compileSdk = 37

              defaultConfig {
                  minSdk = 26
              }
          }

          dependencies {
              implementation(
                  "io.github.sceneview:sceneview:4.37.0"
              )
          }
          EOF

          cat > analysis/isolated-gradle/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.library") version "9.3.3" apply false
          }
          EOF

          cd analysis/isolated-gradle

          if [ -f "../../gradlew" ]; then
            cp ../../gradlew .
            cp -r ../../gradle .
          fi

          if [ -x "./gradlew" ]; then

            ./gradlew \
              :probe:dependencies \
              --configuration debugRuntimeClasspath \
              > dependency_resolution.txt \
              2>&1 \
              || true

          else

            echo "Gradle wrapper unavailable for isolated probe." \
              > dependency_resolution.txt

          fi

          cat dependency_resolution.txt


      # ============================================================
      # 19. CREATE COMPATIBILITY MATRIX
      # ============================================================

      - name: Create compatibility matrix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          project = Path(
              "app/build.gradle.kts"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          pom = Path(
              "analysis/maven/sceneview-4.37.0.pom"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          def find(pattern, text):
              m = re.search(
                  pattern,
                  text,
                  re.IGNORECASE
              )
              return m.group(1) if m else "not detected"

          project_filament = []

          for m in re.finditer(
              r'com\.google\.android\.filament:[^"\s]+',
              project
          ):
              project_filament.append(
                  m.group(0)
              )

          sceneview_filament = []

          for m in re.finditer(
              r'<artifactId>filament[^<]*</artifactId>.*?'
              r'<version>([^<]+)</version>',
              pom,
              re.DOTALL
          ):
              sceneview_filament.append(
                  m.group(0)
              )

          output = []

          output.append(
              "PIFuHDC-3D-Viewer vs SceneView 4.37.0"
          )
          output.append(
              "===================================="
          )
          output.append("")
          output.append(
              "Our compileSdk: " +
              find(
                  r'compileSdk\s*=\s*(\d+)',
                  project
              )
          )
          output.append(
              "Our targetSdk: " +
              find(
                  r'targetSdk\s*=\s*(\d+)',
                  project
              )
          )
          output.append(
              "Our minSdk: " +
              find(
                  r'minSdk\s*=\s*(\d+)',
                  project
              )
          )
          output.append("")
          output.append(
              "Our Filament dependencies:"
          )

          for item in project_filament:
              output.append(
                  "  " + item
              )

          output.append("")
          output.append(
              "SceneView POM Filament references:"
          )

          for item in sceneview_filament:
              output.append(
                  "  " + item
              )

          output.append("")
          output.append(
              "SceneView artifact:"
          )
          output.append(
              "  io.github.sceneview:sceneview:4.37.0"
          )
          output.append("")
          output.append(
              "Result:"
          )
          output.append(
              "  Dependency compatibility requires "
              "Gradle resolution analysis before migration."
          )

          Path(
              "analysis/compatibility_matrix.txt"
          ).write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print("\n".join(output))
          PY


      # ============================================================
      # 20. GENERATE WORD REPORT
      # ============================================================

      - name: Generate Word report
        run: |
          cat > analysis/generate_report.py <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Pt
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.table import WD_TABLE_ALIGNMENT

          OUTPUT = Path(
              "PIFuHDC_SceneView_Compatibility_Analysis.docx"
          )

          doc = Document()

          doc.styles["Normal"].font.name = "Arial"
          doc.styles["Normal"].font.size = Pt(10)

          for style in [
              "Title",
              "Heading 1",
              "Heading 2",
              "Heading 3"
          ]:
              doc.styles[style].font.name = "Arial"

          title = doc.add_heading(
              "PIFuHDC 3D Viewer",
              0
          )

          title.alignment = WD_ALIGN_PARAGRAPH.CENTER

          p = doc.add_paragraph()

          p.alignment = WD_ALIGN_PARAGRAPH.CENTER

          r = p.add_run(
              "SceneView 4.37.0 Compatibility "
              "and GLB Viewer Analysis"
          )

          r.bold = True

          p = doc.add_paragraph()

          p.alignment = WD_ALIGN_PARAGRAPH.CENTER

          p.add_run(
              "Bootstrap 6 • Read-only inspection"
          )

          doc.add_page_break()

          def heading(text, level=1):
              doc.add_heading(
                  text,
                  level
              )

          def paragraph(text):
              doc.add_paragraph(text)

          def code_section(title, path, limit=50000):
              heading(title, 2)

              path = Path(path)

              if not path.exists():
                  paragraph(
                      f"File not found: {path}"
                  )
                  return

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              if len(text) > limit:
                  text = (
                      text[:limit] +
                      "\n\n[TRUNCATED]\n"
                  )

              p = doc.add_paragraph()

              r = p.add_run(text)

              r.font.name = "Courier New"
              r.font.size = Pt(8)

          heading("1. Purpose")

          paragraph(
              "This report determines whether SceneView 4.37.0 "
              "can replace the custom GLB rendering layer in "
              "PIFuHDC-3D-Viewer."
          )

          paragraph(
              "Bootstrap 6 does not modify application source code, "
              "Gradle files, the manifest, Bootstrap 3, Bootstrap 5, "
              "or the existing build workflow."
          )

          heading("2. Verified SceneView Artifact")

          paragraph(
              "The inspected Android 3D artifact is:"
          )

          paragraph(
              "io.github.sceneview:sceneview:4.37.0"
          )

          paragraph(
              "SceneView 4.37.0 is a published Maven artifact and "
              "the official project documents it as the Android "
              "3D-only dependency."
          )

          heading("3. SceneView Architecture")

          paragraph(
              "SceneView is a declarative Android 3D API built on "
              "Filament. Its documented GLB path uses SceneView, "
              "ModelLoader/model instances and ModelNode rather "
              "than requiring the application to manually construct "
              "the complete Filament rendering lifecycle."
          )

          heading("4. Current Project Configuration")

          code_section(
              "Current project files",
              "analysis/project/current_project.txt",
              60000
          )

          heading("5. Current Renderer")

          code_section(
              "Current GLB/Filament API usage",
              "analysis/project/current_renderer_usage.txt",
              30000
          )

          heading("6. Current Android Source")

          code_section(
              "Current source snapshot",
              "analysis/project/source/all_source.txt",
              80000
          )

          heading("7. SceneView Build Configuration")

          code_section(
              "SceneView dependency/build analysis",
              "analysis/sceneview/inspection/build_config.txt",
              50000
          )

          heading("8. SceneView GLB Loading")

          code_section(
              "SceneView GLB/model loading references",
              "analysis/sceneview/inspection/glb_loading.txt",
              50000
          )

          heading("9. SceneView Rendering")

          code_section(
              "SceneView rendering references",
              "analysis/sceneview/inspection/rendering.txt",
              60000
          )

          heading("10. Camera and Gesture Support")

          code_section(
              "Camera and gesture references",
              "analysis/sceneview/inspection/camera_gestures.txt",
              60000
          )

          heading("11. Working SceneView Examples")

          code_section(
              "Examples found in source",
              "analysis/sceneview/inspection/examples.txt",
              60000
          )

          heading("12. Compose Requirements")

          code_section(
              "Compose analysis",
              "analysis/sceneview/inspection/compose.txt",
              50000
          )

          heading("13. Native ABI Analysis")

          code_section(
              "Native ABI references",
              "analysis/sceneview/inspection/native.txt",
              30000
          )

          heading("14. SceneView Dependency Metadata")

          code_section(
              "SceneView POM",
              "analysis/maven/sceneview-4.37.0.pom",
              30000
          )

          code_section(
              "SceneView Core POM",
              "analysis/maven/sceneview-core-4.37.0.pom",
              30000
          )

          heading("15. Filament Compatibility")

          paragraph(
              "This section is intentionally based on the published "
              "Maven metadata and the repository source rather than "
              "a guessed dependency version."
          )

          code_section(
              "Compatibility matrix",
              "analysis/compatibility_matrix.txt",
              20000
          )

          heading("16. Current Gradle Dependency Graph")

          code_section(
              "Existing project dependency graph",
              "analysis/project/dependency_graph.txt",
              50000
          )

          heading("17. Isolated SceneView Dependency Probe")

          code_section(
              "SceneView-only dependency resolution",
              "analysis/isolated-gradle/dependency_resolution.txt",
              50000
          )

          heading("18. Important Migration Boundary")

          paragraph(
              "The safest eventual migration boundary is the GLB "
              "viewer only. PIFuHDC reconstruction and GLB generation "
              "should remain independent from the viewer."
          )

          paragraph(
              "Desired architecture:"
          )

          paragraph(
              "PIFuHDC reconstruction → GLB → SceneView ModelLoader "
              "→ ModelNode → Filament → Android display"
          )

          heading("19. Files That Should NOT Be Modified by Bootstrap 6")

          for item in [
              "MainActivity.kt",
              "DuckTestActivity.kt",
              "app/build.gradle.kts",
              "AndroidManifest.xml",
              "build.yml",
              "Bootstrap 3",
              "Bootstrap 5",
              "existing model files"
          ]:
              doc.add_paragraph(
                  item,
                  style="List Bullet"
              )

          heading("20. Questions This Report Must Answer")

          questions = [
              "Does SceneView resolve cleanly with the project's AGP and SDK?",
              "Which exact Filament version does SceneView resolve?",
              "Does it conflict with Filament 1.76.1?",
              "Does SceneView require Compose dependencies?",
              "Can the existing activity host the SceneView API?",
              "Can GLB data from the existing file picker be loaded?",
              "Which existing Filament dependencies become redundant?",
              "Which native ABIs are supplied?",
              "What is the smallest safe migration?",
              "Can the current PIFuHDC → GLB architecture remain unchanged?"
          ]

          for q in questions:
              doc.add_paragraph(
                  q,
                  style="List Number"
              )

          heading("21. Conclusion")

          paragraph(
              "Bootstrap 6 is an analysis-only workflow. It does not "
              "make any application changes. The report provides the "
              "dependency, API, GLB-loading and rendering information "
              "needed before replacing the current custom renderer."
          )

          doc.save(OUTPUT)

          print(
              f"Created: {OUTPUT}"
          )
          PY

          python analysis/generate_report.py


      # ============================================================
      # 21. UPLOAD EVERYTHING
      # ============================================================

      - name: Upload Bootstrap 6 report
        uses: actions/upload-artifact@v4
        with:
          name: PIFuHDC-SceneView-Compatibility-Analysis
          path: |
            PIFuHDC_SceneView_Compatibility_Analysis.docx
            analysis/
          if-no-files-found: error
