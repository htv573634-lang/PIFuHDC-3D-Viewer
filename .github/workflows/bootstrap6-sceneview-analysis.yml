name: Bootstrap 6 - SceneView Compatibility Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sceneview-analysis:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT OUR PROJECT
      # ============================================================

      - name: Checkout PIFuHDC-3D-Viewer
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON
      # ============================================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report generator
        run: |
          python -m pip install --upgrade pip
          pip install python-docx


      # ============================================================
      # 4. DOWNLOAD EXACT SCENEVIEW SOURCE
      # ============================================================

      - name: Clone SceneView 4.37.0
        run: |
          set -e

          mkdir -p analysis/sceneview

          git clone \
            --depth 1 \
            --branch v4.37.0 \
            https://github.com/SceneView/sceneview.git \
            analysis/sceneview/source

          cd analysis/sceneview/source

          echo "SceneView commit:"
          git rev-parse HEAD

          echo
          echo "SceneView tag:"
          git describe --tags --always


      # ============================================================
      # 5. VERIFY SCENEVIEW MAVEN ARTIFACTS
      # ============================================================

      - name: Verify SceneView Maven artifacts
        run: |
          set -e

          mkdir -p analysis/maven

          BASE="https://repo1.maven.org/maven2/io/github/sceneview"

          echo "Checking SceneView AAR..."

          curl -I \
            --fail \
            --silent \
            --show-error \
            "$BASE/sceneview/4.37.0/sceneview-4.37.0.aar"

          echo
          echo "Checking SceneView POM..."

          curl -I \
            --fail \
            --silent \
            --show-error \
            "$BASE/sceneview/4.37.0/sceneview-4.37.0.pom"

          echo
          echo "Checking SceneView Core POM..."

          curl -I \
            --fail \
            --silent \
            --show-error \
            "$BASE/sceneview-core/4.37.0/sceneview-core-4.37.0.pom"

          echo
          echo "Downloading SceneView POM..."

          curl -L \
            --fail \
            --retry 3 \
            -o analysis/maven/sceneview-4.37.0.pom \
            "$BASE/sceneview/4.37.0/sceneview-4.37.0.pom"

          echo
          echo "Downloading SceneView Core POM..."

          curl -L \
            --fail \
            --retry 3 \
            -o analysis/maven/sceneview-core-4.37.0.pom \
            "$BASE/sceneview-core/4.37.0/sceneview-core-4.37.0.pom"

          echo
          echo "SceneView POM:"
          cat analysis/maven/sceneview-4.37.0.pom

          echo
          echo "SceneView Core POM:"
          cat analysis/maven/sceneview-core-4.37.0.pom


      # ============================================================
      # 6. SNAPSHOT CURRENT PROJECT
      # ============================================================

      - name: Snapshot current project
        run: |
          set -e

          mkdir -p analysis/project

          {
            echo "============================================================"
            echo "PROJECT TREE"
            echo "============================================================"

            find app/src/main \
              -type f \
              | sort

            echo
            echo "============================================================"
            echo "APP BUILD GRADLE"
            echo "============================================================"

            nl -ba app/build.gradle.kts

            echo
            echo "============================================================"
            echo "ROOT BUILD GRADLE"
            echo "============================================================"

            nl -ba build.gradle.kts

            echo
            echo "============================================================"
            echo "SETTINGS"
            echo "============================================================"

            nl -ba settings.gradle.kts

            echo
            echo "============================================================"
            echo "GRADLE PROPERTIES"
            echo "============================================================"

            nl -ba gradle.properties

            echo
            echo "============================================================"
            echo "MANIFEST"
            echo "============================================================"

            nl -ba app/src/main/AndroidManifest.xml

          } > analysis/project/current_project.txt

          cat analysis/project/current_project.txt


      # ============================================================
      # 7. INSPECT CURRENT ANDROID SOURCE
      # ============================================================

      - name: Snapshot Android source
        run: |
          set -e

          mkdir -p analysis/project/source

          find app/src/main \
            -type f \
            \( \
              -name "*.kt" -o \
              -name "*.java" -o \
              -name "*.xml" \
            \) \
            -print \
            | sort \
            > analysis/project/source/file_list.txt

          while IFS= read -r file; do

            echo
            echo "============================================================"
            echo "FILE: $file"
            echo "============================================================"

            nl -ba "$file"

          done < analysis/project/source/file_list.txt \
            > analysis/project/source/all_source.txt


      # ============================================================
      # 8. ANALYZE CURRENT GLB / FILAMENT IMPLEMENTATION
      # ============================================================

      - name: Analyze current GLB renderer
        run: |
          set -e

          {
            echo "CURRENT GLB / FILAMENT API USAGE"
            echo "================================"
            echo

            grep -R \
              -n \
              -E \
              "ModelViewer|Utils\.init|loadModelGlb|transformToUnitCube|FilamentAsset|AssetLoader|ResourceLoader|Engine|Renderer|SwapChain|Scene|Camera|TextureView|Surface|Choreographer" \
              app/src/main \
              2>/dev/null \
              || true

          } > analysis/project/current_renderer_usage.txt

          cat analysis/project/current_renderer_usage.txt


      # ============================================================
      # 9. SCENEVIEW SOURCE TREE
      # ============================================================

      - name: Inspect SceneView source tree
        run: |
          set -e

          mkdir -p analysis/sceneview/inspection

          find analysis/sceneview/source \
            -type f \
            | sort \
            > analysis/sceneview/inspection/tree.txt


      # ============================================================
      # 10. SCENEVIEW BUILD CONFIGURATION
      # ============================================================

      - name: Analyze SceneView dependencies
        run: |
          set -e

          {
            echo "SCENEVIEW BUILD / DEPENDENCY CONFIGURATION"
            echo "==========================================="
            echo

            find analysis/sceneview/source \
              -type f \
              \( \
                -name "*.gradle" -o \
                -name "*.gradle.kts" -o \
                -name "*.toml" -o \
                -name "*.properties" \
              \) \
              -print \
              | sort

            echo
            echo "------------------------------------------------------------"
            echo "FILAMENT REFERENCES"
            echo "------------------------------------------------------------"

            grep -R \
              -n \
              -E \
              "filament|gltfio|filament-utils|kotlin-math|compose-bom|compileSdk|minSdk|targetSdk|kotlin" \
              analysis/sceneview/source \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              --include="*.toml" \
              --include="*.properties" \
              2>/dev/null \
              | head -n 10000 \
              || true

          } > analysis/sceneview/inspection/build_config.txt

          cat analysis/sceneview/inspection/build_config.txt


      # ============================================================
      # 11. FIND SCENEVIEW GLB LOADING
      # ============================================================

      - name: Analyze SceneView GLB loading
        run: |
          set -e

          {
            echo "SCENEVIEW GLB LOADING"
            echo "===================="
            echo

            grep -R \
              -n \
              -E \
              "rememberModelInstance|ModelLoader|ModelNode|loadModelGlb|loadModelGltf|createModelInstance|loadModel" \
              analysis/sceneview/source \
              --include="*.kt" \
              --include="*.java" \
              2>/dev/null \
              | head -n 10000 \
              || true

          } > analysis/sceneview/inspection/glb_loading.txt

          cat analysis/sceneview/inspection/glb_loading.txt


      # ============================================================
      # 12. FIND SCENEVIEW RENDERING
      # ============================================================

      - name: Analyze SceneView renderer
        run: |
          set -e

          {
            echo "SCENEVIEW RENDERING IMPLEMENTATION"
            echo "================================="
            echo

            grep -R \
              -n \
              -E \
              "class SceneView|fun SceneView|rememberEngine|Engine|Renderer|SwapChain|View|Scene|Camera|SurfaceView|TextureView|Choreographer" \
              analysis/sceneview/source \
              --include="*.kt" \
              --include="*.java" \
              2>/dev/null \
              | head -n 15000 \
              || true

          } > analysis/sceneview/inspection/rendering.txt

          cat analysis/sceneview/inspection/rendering.txt


      # ============================================================
      # 13. CAMERA / GESTURE SUPPORT
      # ============================================================

      - name: Analyze camera and gestures
        run: |
          set -e

          {
            echo "SCENEVIEW CAMERA / GESTURE SUPPORT"
            echo "================================="
            echo

            grep -R \
              -n \
              -E \
              "CameraManipulator|DefaultCameraManipulator|rememberCameraManipulator|zoom|pan|orbit|gesture|Gesture|onTouch|doubleTap|pinch|rotation" \
              analysis/sceneview/source \
              --include="*.kt" \
              --include="*.java" \
              2>/dev/null \
              | head -n 15000 \
              || true

          } > analysis/sceneview/inspection/camera_gestures.txt

          cat analysis/sceneview/inspection/camera_gestures.txt


      # ============================================================
      # 14. FIND WORKING SCENEVIEW EXAMPLES
      # ============================================================

      - name: Find SceneView model examples
        run: |
          set -e

          {
            echo "SCENEVIEW MODEL EXAMPLES"
            echo "======================="
            echo

            grep -R \
              -n \
              -E \
              "\.glb|\.gltf|rememberModelInstance|ModelNode|SceneView\s*\{" \
              analysis/sceneview/source \
              --include="*.kt" \
              --include="*.java" \
              2>/dev/null \
              | head -n 15000 \
              || true

          } > analysis/sceneview/inspection/examples.txt

          cat analysis/sceneview/inspection/examples.txt


      # ============================================================
      # 15. COMPOSE REQUIREMENTS
      # ============================================================

      - name: Analyze Compose requirements
        run: |
          set -e

          {
            echo "SCENEVIEW COMPOSE REQUIREMENTS"
            echo "============================="
            echo

            grep -R \
              -n \
              -E \
              "androidx.compose|compose-bom|@Composable|Compose" \
              analysis/sceneview/source \
              --include="*.kt" \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              --include="*.toml" \
              2>/dev/null \
              | head -n 15000 \
              || true

          } > analysis/sceneview/inspection/compose.txt

          cat analysis/sceneview/inspection/compose.txt


      # ============================================================
      # 16. NATIVE ABI ANALYSIS
      # ============================================================

      - name: Analyze SceneView native libraries
        run: |
          set -e

          {
            echo "SCENEVIEW NATIVE / ABI REFERENCES"
            echo "================================"
            echo

            grep -R \
              -n \
              -E \
              "arm64-v8a|armeabi-v7a|x86_64|jniLibs|\.so|filament-android" \
              analysis/sceneview/source \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              --include="*.xml" \
              --include="*.properties" \
              2>/dev/null \
              | head -n 10000 \
              || true

          } > analysis/sceneview/inspection/native.txt

          cat analysis/sceneview/inspection/native.txt


      # ============================================================
      # 17. CURRENT PROJECT GRADLE DEPENDENCY GRAPH
      # ============================================================

      - name: Resolve current Gradle dependencies
        run: |
          set +e

          mkdir -p analysis/project

          if [ -x "./gradlew" ]; then

            ./gradlew \
              :app:dependencies \
              --configuration debugRuntimeClasspath \
              > analysis/project/dependency_graph.txt \
              2>&1

            STATUS=$?

            echo
            echo "Gradle dependency command exit code: $STATUS"

          else

            echo "Gradle wrapper not found." \
              > analysis/project/dependency_graph.txt

          fi

          cat analysis/project/dependency_graph.txt

          exit 0


      # ============================================================
      # 18. ISOLATED SCENEVIEW DEPENDENCY TEST
      # ============================================================

      - name: Create isolated SceneView dependency test
        run: |
          set -e

          mkdir -p analysis/isolated-gradle

          cat > analysis/isolated-gradle/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SceneViewDependencyProbe"

          include(":probe")
          EOF

          mkdir -p analysis/isolated-gradle/probe

          cat > analysis/isolated-gradle/probe/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.library") version "9.3.3"
          }

          android {
              namespace = "com.pifuhdc.sceneview.probe"

              compileSdk = 37

              defaultConfig {
                  minSdk = 26
              }
          }

          dependencies {
              implementation(
                  "io.github.sceneview:sceneview:4.37.0"
              )
          }
          EOF

          cat > analysis/isolated-gradle/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.library") version "9.3.3" apply false
          }
          EOF

          cd analysis/isolated-gradle

          if [ -f "../../gradlew" ]; then
            cp ../../gradlew .
            cp -r ../../gradle .
          fi

          if [ -x "./gradlew" ]; then

            ./gradlew \
              :probe:dependencies \
              --configuration debugRuntimeClasspath \
              > dependency_resolution.txt \
              2>&1 \
              || true

          else

            echo "Gradle wrapper unavailable for isolated probe." \
              > dependency_resolution.txt

          fi

          cat dependency_resolution.txt


      # ============================================================
      # 19. CREATE COMPATIBILITY MATRIX
      # ============================================================

      - name: Create compatibility matrix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          project_path = Path(
              "app/build.gradle.kts"
          )

          pom_path = Path(
              "analysis/maven/sceneview-4.37.0.pom"
          )

          project = project_path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          pom = pom_path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          def find(pattern, text):
              m = re.search(
                  pattern,
                  text,
                  re.IGNORECASE
              )
              return m.group(1) if m else "not detected"

          project_filament = []

          for m in re.finditer(
              r'com\.google\.android\.filament:[^"\s]+',
              project
          ):
              project_filament.append(
                  m.group(0)
              )

          sceneview_dependencies = []

          for m in re.finditer(
              r'<dependency>.*?</dependency>',
              pom,
              re.DOTALL
          ):
              block = m.group(0)

              artifact = find(
                  r'<artifactId>([^<]+)</artifactId>',
                  block
              )

              version = find(
                  r'<version>([^<]+)</version>',
                  block
              )

              group = find(
                  r'<groupId>([^<]+)</groupId>',
                  block
              )

              sceneview_dependencies.append(
                  f"{group}:{artifact}:{version}"
              )

          output = []

          output.append(
              "PIFuHDC-3D-Viewer vs SceneView 4.37.0"
          )
          output.append(
              "===================================="
          )
          output.append("")

          output.append(
              "Current project compileSdk: " +
              find(
                  r'compileSdk\s*=\s*(\d+)',
                  project
              )
          )

          output.append(
              "Current project targetSdk: " +
              find(
                  r'targetSdk\s*=\s*(\d+)',
                  project
              )
          )

          output.append(
              "Current project minSdk: " +
              find(
                  r'minSdk\s*=\s*(\d+)',
                  project
              )
          )

          output.append("")
          output.append(
              "Current Filament dependencies:"
          )

          if project_filament:
              for item in project_filament:
                  output.append(
                      "  " + item
                  )
          else:
              output.append(
                  "  none detected"
              )

          output.append("")
          output.append(
              "SceneView published dependencies:"
          )

          for item in sceneview_dependencies:
              output.append(
                  "  " + item
              )

          output.append("")
          output.append(
              "SceneView artifact:"
          )

          output.append(
              "  io.github.sceneview:sceneview:4.37.0"
          )

          output.append("")
          output.append(
              "Important:"
          )

          output.append(
              "  This is an analysis report only."
          )

          output.append(
              "  No application dependency has been changed."
          )

          Path(
              "analysis/compatibility_matrix.txt"
          ).write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print("\n".join(output))
          PY


      # ============================================================
      # 20. GENERATE WORD REPORT
      # ============================================================

      - name: Generate Word report
        run: |
          cat > analysis/generate_report.py <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Pt
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          OUTPUT = Path(
              "PIFuHDC_SceneView_Compatibility_Analysis.docx"
          )

          doc = Document()

          doc.styles["Normal"].font.name = "Arial"
          doc.styles["Normal"].font.size = Pt(10)

          for style in [
              "Title",
              "Heading 1",
              "Heading 2",
              "Heading 3"
          ]:
              doc.styles[style].font.name = "Arial"

          title = doc.add_heading(
              "PIFuHDC 3D Viewer",
              0
          )

          title.alignment = WD_ALIGN_PARAGRAPH.CENTER

          p = doc.add_paragraph()

          p.alignment = WD_ALIGN_PARAGRAPH.CENTER

          r = p.add_run(
              "SceneView 4.37.0 Compatibility "
              "and GLB Viewer Analysis"
          )

          r.bold = True

          p = doc.add_paragraph()

          p.alignment = WD_ALIGN_PARAGRAPH.CENTER

          p.add_run(
              "Bootstrap 6 • Read-only inspection"
          )

          doc.add_page_break()

          def heading(text, level=1):
              doc.add_heading(
                  text,
                  level
              )

          def paragraph(text):
              doc.add_paragraph(text)

          def code_section(title, path, limit=50000):
              heading(title, 2)

              path = Path(path)

              if not path.exists():
                  paragraph(
                      f"File not found: {path}"
                  )
                  return

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              if len(text) > limit:
                  text = (
                      text[:limit] +
                      "\n\n[TRUNCATED]\n"
                  )

              p = doc.add_paragraph()

              r = p.add_run(text)

              r.font.name = "Courier New"
              r.font.size = Pt(8)

          heading("1. Purpose")

          paragraph(
              "This report determines whether SceneView 4.37.0 "
              "can replace the custom GLB rendering layer in "
              "PIFuHDC-3D-Viewer."
          )

          paragraph(
              "Bootstrap 6 performs analysis only. It does not "
              "modify application source code, Gradle files, "
              "the Android manifest, or existing workflows."
          )

          heading("2. SceneView Artifact")

          paragraph(
              "The inspected Android 3D dependency is:"
          )

          paragraph(
              "io.github.sceneview:sceneview:4.37.0"
          )

          paragraph(
              "The dependency is resolved through Maven rather "
              "than manually copying individual AAR files."
          )

          heading("3. Current Project Configuration")

          code_section(
              "Current project configuration",
              "analysis/project/current_project.txt",
              60000
          )

          heading("4. Current Renderer")

          code_section(
              "Current GLB / Filament usage",
              "analysis/project/current_renderer_usage.txt",
              30000
          )

          heading("5. Current Android Source")

          code_section(
              "Current source snapshot",
              "analysis/project/source/all_source.txt",
              80000
          )

          heading("6. SceneView Build Configuration")

          code_section(
              "SceneView build configuration",
              "analysis/sceneview/inspection/build_config.txt",
              50000
          )

          heading("7. SceneView GLB Loading")

          code_section(
              "GLB loading references",
              "analysis/sceneview/inspection/glb_loading.txt",
              50000
          )

          heading("8. SceneView Rendering")

          code_section(
              "Rendering references",
              "analysis/sceneview/inspection/rendering.txt",
              60000
          )

          heading("9. Camera and Gestures")

          code_section(
              "Camera and gesture references",
              "analysis/sceneview/inspection/camera_gestures.txt",
              60000
          )

          heading("10. Working Examples")

          code_section(
              "GLB/model examples",
              "analysis/sceneview/inspection/examples.txt",
              60000
          )

          heading("11. Compose Requirements")

          code_section(
              "Compose analysis",
              "analysis/sceneview/inspection/compose.txt",
              50000
          )

          heading("12. Native ABI Analysis")

          code_section(
              "Native library references",
              "analysis/sceneview/inspection/native.txt",
              30000
          )

          heading("13. SceneView Maven Metadata")

          code_section(
              "SceneView POM",
              "analysis/maven/sceneview-4.37.0.pom",
              30000
          )

          code_section(
              "SceneView Core POM",
              "analysis/maven/sceneview-core-4.37.0.pom",
              30000
          )

          heading("14. Compatibility Matrix")

          code_section(
              "Compatibility matrix",
              "analysis/compatibility_matrix.txt",
              30000
          )

          heading("15. Existing Dependency Graph")

          code_section(
              "Current project dependencies",
              "analysis/project/dependency_graph.txt",
              50000
          )

          heading("16. Isolated SceneView Dependency Probe")

          code_section(
              "SceneView dependency resolution",
              "analysis/isolated-gradle/dependency_resolution.txt",
              50000
          )

          heading("17. Recommended Architecture")

          paragraph(
              "The intended architecture remains:"
          )

          paragraph(
              "PIFuHDC reconstruction → GLB → SceneView "
              "ModelLoader → ModelNode → Filament → Android display"
          )

          paragraph(
              "PIFuHDC reconstruction should remain separate from "
              "the GLB viewer. SceneView is being evaluated only "
              "as the 3D display layer."
          )

          heading("18. Files Bootstrap 6 Must Not Modify")

          for item in [
              "MainActivity.kt",
              "DuckTestActivity.kt",
              "app/build.gradle.kts",
              "AndroidManifest.xml",
              "build.yml",
              "Bootstrap 3",
              "Bootstrap 5",
              "existing model files"
          ]:
              doc.add_paragraph(
                  item,
                  style="List Bullet"
              )

          heading("19. Final Assessment")

          paragraph(
              "The final decision about replacing the existing "
              "Filament renderer should be made only after reviewing "
              "the actual dependency-resolution results, API usage, "
              "GLB loading path, camera controls, Compose requirements, "
              "and native ABI information collected by this workflow."
          )

          doc.save(OUTPUT)

          print(
              f"Created: {OUTPUT}"
          )
          PY

          python analysis/generate_report.py


      # ============================================================
      # 21. SHOW FINAL SIZE BEFORE UPLOAD
      # ============================================================

      - name: Show report artifact size
        run: |
          echo "Files that will be uploaded:"
          echo

          du -h \
            PIFuHDC_SceneView_Compatibility_Analysis.docx \
            analysis/project/*.txt \
            analysis/compatibility_matrix.txt \
            analysis/maven/*.pom \
            analysis/sceneview/inspection/*.txt \
            analysis/isolated-gradle/dependency_resolution.txt

          echo
          echo "Total:"
          du -ch \
            PIFuHDC_SceneView_Compatibility_Analysis.docx \
            analysis/project/*.txt \
            analysis/compatibility_matrix.txt \
            analysis/maven/*.pom \
            analysis/sceneview/inspection/*.txt \
            analysis/isolated-gradle/dependency_resolution.txt \
            | tail -n 1


      # ============================================================
      # 22. UPLOAD ONLY SMALL ANALYSIS OUTPUT
      # ============================================================

      - name: Upload Bootstrap 6 report
        uses: actions/upload-artifact@v4
        with:
          name: PIFuHDC-SceneView-Compatibility-Analysis
          path: |
            PIFuHDC_SceneView_Compatibility_Analysis.docx
            analysis/project/*.txt
            analysis/compatibility_matrix.txt
            analysis/maven/*.pom
            analysis/sceneview/inspection/*.txt
