name: Bootstrap 3 - Permanent PIFuHDC 3D Viewer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Create Permanent Android Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Show repository before bootstrap
        run: |
          echo "===== BEFORE BOOTSTRAP ====="
          find . -maxdepth 5 -type f | sort || true

      # ------------------------------------------------------------
      # ROOT GRADLE PROJECT
      # ------------------------------------------------------------

      - name: Create settings.gradle.kts
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PIFuHDC-3D-Viewer"

          include(":app")
          EOF

      - name: Create root build.gradle.kts
        run: |
          cat > build.gradle.kts <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }

              dependencies {
                  classpath(
                      "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20"
                  )
              }
          }

          plugins {
              id("com.android.application") version "9.3.3" apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # ------------------------------------------------------------
      # APP MODULE
      # ------------------------------------------------------------

      - name: Create app directories
        run: |
          mkdir -p app/src/main/java/com/pifuhdc/viewer
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets/models
          mkdir -p app/src/main/assets/sample

      - name: Create app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.pifuhdc.viewer"

              compileSdk = 37
              compileSdkMinor = 0

              defaultConfig {
                  applicationId = "com.pifuhdc.viewer"
                  minSdk = 26
                  targetSdk = 37
                  versionCode = 3
                  versionName = "0.3.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }

                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }

                  resources {
                      excludes += setOf(
                          "META-INF/AL2.0",
                          "META-INF/LGPL2.1",
                          "META-INF/*.version"
                      )
                  }
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          dependencies {
              implementation(
                  "com.google.android.filament:filament-android:1.76.1"
              )

              implementation(
                  "com.google.android.filament:gltfio-android:1.76.1"
              )

              implementation(
                  "com.google.android.filament:filament-utils-android:1.76.1"
              )
          }
          EOF

      # ------------------------------------------------------------
      # ANDROID MANIFEST
      # ------------------------------------------------------------

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.opengles.aep"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />

                          <data android:mimeType="model/gltf-binary" />
                          <data android:mimeType="model/gltf+json" />
                          <data android:mimeType="application/octet-stream" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ------------------------------------------------------------
      # RESOURCES
      # ------------------------------------------------------------

      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">PIFuHDC 3D Viewer</string>
          </resources>
          EOF

      - name: Create styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#555555</item>

              </style>

          </resources>
          EOF

      # ------------------------------------------------------------
      # KEEP REAL MAIN ACTIVITY
      # ------------------------------------------------------------

      - name: Verify real MainActivity
        run: |
          if [ ! -f "app/src/main/java/com/pifuhdc/viewer/MainActivity.kt" ]; then
            echo "ERROR: Real MainActivity.kt is missing."
            echo ""
            echo "Bootstrap 3 will NOT create a temporary activity."
            echo "Please add the real MainActivity.kt first."
            exit 1
          fi

          echo "Real MainActivity.kt found."
          wc -l app/src/main/java/com/pifuhdc/viewer/MainActivity.kt

      # ------------------------------------------------------------
      # REMOVE OLD LOCAL FILAMENT FILES
      # ------------------------------------------------------------

      - name: Remove obsolete local Filament AARs
        run: |
          rm -f app/libs/filament.aar
          rm -f app/libs/gltfio.aar
          rm -f app/libs/filament-utils-api.aar

      # ------------------------------------------------------------
      # GRADLE WRAPPER
      # ------------------------------------------------------------

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.5.1

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      # ------------------------------------------------------------
      # VERIFY PROJECT STRUCTURE
      # ------------------------------------------------------------

      - name: Verify Gradle project
        run: |
          echo "===== PROJECT FILES ====="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/pifuhdc/viewer/MainActivity.kt

          echo ""
          echo "===== GRADLE PROJECTS ====="

          ./gradlew projects \
            --stacktrace \
            --no-daemon

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------

      - name: Clean
        run: |
          ./gradlew clean \
            --stacktrace \
            --no-daemon

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        run: |
          echo "===== APK OUTPUT ====="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

          test -f \
            app/build/outputs/apk/debug/app-debug.apk

      # ------------------------------------------------------------
      # UPLOAD APK
      # ------------------------------------------------------------

      - name: Upload Bootstrap 3 APK
        uses: actions/upload-artifact@v4
        with:
          name: PIFuHDC-3D-Viewer-bootstrap3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # COMMIT PERMANENT PROJECT FILES
      # ------------------------------------------------------------

      - name: Commit permanent project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            settings.gradle.kts \
            build.gradle.kts \
            gradle.properties \
            gradle/ \
            gradlew \
            gradlew.bat \
            app/

          if git diff --cached --quiet; then
            echo "No permanent project changes to commit."
          else
            git commit \
              -m "Bootstrap permanent PIFuHDC 3D Viewer project"

            git push origin HEAD:main
          fi

      - name: Final repository status
        if: always()
        run: |
          echo "===== FINAL STATUS ====="
          git status --short
          echo ""
          echo "Bootstrap 3 completed."
