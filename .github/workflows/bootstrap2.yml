name: Bootstrap 2 - PIFuHDC 3D Viewer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap2:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. LOCATE ANDROID SDK
      # ============================================================
      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          SDK_ROOT=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -d "/opt/android-sdk" ]; then
            SDK_ROOT="/opt/android-sdk"
          fi

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory was not found."

            echo "Searching filesystem..."
            find /opt /usr/local /home/runner \
              -maxdepth 5 \
              -type d \
              -name "android-sdk" \
              2>/dev/null || true

            exit 1
          fi

          echo "Android SDK root:"
          echo "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # 4. LOCATE SDKMANAGER
      # ============================================================
      - name: Locate sdkmanager
        shell: bash
        run: |
          set -e

          SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER=""

          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager" \
            "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" \
            "/usr/local/lib/android/sdk/cmdline-tools/bin/sdkmanager" \
            "/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "/opt/android-sdk/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in standard locations."

            echo ""
            echo "Searching for sdkmanager:"
            find "$SDK_ROOT" \
              -type f \
              -name "sdkmanager" \
              2>/dev/null || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"


      # ============================================================
      # 5. ANDROID API 37
      # ============================================================
      - name: Install Android API 37
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Installing required Android components..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

          echo "Checking API 37..."

          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "ERROR: Android API 37 was not installed."

            exit 1
          fi

          echo ""
          echo "Android API 37 installed successfully."


      # ============================================================
      # 6. GRADLE 9.5
      # ============================================================
      - name: Setup Gradle 9.5
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-9.5-bin.zip \
            -O /tmp/gradle-9.5.zip

          unzip -q \
            /tmp/gradle-9.5.zip \
            -d /opt

          echo "/opt/gradle-9.5/bin" >> "$GITHUB_PATH"

          export PATH="/opt/gradle-9.5/bin:$PATH"

          echo ""
          echo "Gradle version:"
          gradle --version


      # ============================================================
      # 7. CREATE DIRECTORIES
      # ============================================================
      - name: Create project directories
        shell: bash
        run: |
          set -e

          mkdir -p .github/workflows

          mkdir -p \
            app/src/main/java/com/pifuhdc/viewer

          mkdir -p \
            app/src/main/res/values

          mkdir -p \
            app/src/main/assets/models

          mkdir -p \
            app/src/main/assets/sample

          mkdir -p \
            app/src/main/cpp

          mkdir -p \
            app/libs

          mkdir -p \
            gradle/wrapper


      # ============================================================
      # 8. DOWNLOAD FILAMENT
      # ============================================================
      - name: Download Filament 1.77.0
        shell: bash
        run: |
          set -e

          VERSION="1.77.0"

          BASE_URL="https://github.com/google/filament/releases/download/v${VERSION}"

          echo "Downloading Filament ${VERSION}..."

          wget -q \
            "${BASE_URL}/filament-v${VERSION}-android.aar" \
            -O app/libs/filament.aar

          wget -q \
            "${BASE_URL}/gltfio-v${VERSION}-android.aar" \
            -O app/libs/gltfio.aar

          wget -q \
            "${BASE_URL}/filament-utils-v${VERSION}-android.aar" \
            -O app/libs/filament-utils.aar

          echo ""
          echo "Filament libraries:"
          ls -lh app/libs/

          test -s app/libs/filament.aar
          test -s app/libs/gltfio.aar
          test -s app/libs/filament-utils.aar

          echo ""
          echo "Filament download successful."


      # ============================================================
      # 9. SETTINGS
      # ============================================================
      - name: Write settings.gradle.kts
        shell: bash
        run: |
          cat > settings.gradle.kts <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PIFuHDC-3D-Viewer"

          include(":app")
          EOF


      # ============================================================
      # 10. ROOT BUILD
      # ============================================================
      - name: Write root build.gradle.kts
        shell: bash
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.3.3" apply false
              id("org.jetbrains.kotlin.android") version "2.2.10" apply false
          }
          EOF


      # ============================================================
      # 11. GRADLE PROPERTIES
      # ============================================================
      - name: Write gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF


      # ============================================================
      # 12. APP BUILD FILE
      # ============================================================
      - name: Write app/build.gradle.kts
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {

              namespace = "com.pifuhdc.viewer"

              compileSdk = 37

              defaultConfig {

                  applicationId =
                      "com.pifuhdc.viewer"

                  minSdk = 26

                  targetSdk = 37

                  versionCode = 3

                  versionName = "0.3.0"
              }

              buildTypes {

                  release {

                      isMinifyEnabled = false

                      proguardFiles(
                          getDefaultProguardFile(
                              "proguard-android-optimize.txt"
                          ),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {

                  sourceCompatibility =
                      JavaVersion.VERSION_17

                  targetCompatibility =
                      JavaVersion.VERSION_17
              }

              kotlinOptions {

                  jvmTarget = "17"
              }

              packaging {

                  resources.excludes +=
                      "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {

              implementation(
                  files(
                      "libs/filament.aar"
                  )
              )

              implementation(
                  files(
                      "libs/gltfio.aar"
                  )
              )

              implementation(
                  files(
                      "libs/filament-utils.aar"
                  )
              )
          }
          EOF


      # ============================================================
      # 13. MANIFEST
      # ============================================================
      - name: Write AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                      <intent-filter>

                          <action
                              android:name="android.intent.action.VIEW" />

                          <category
                              android:name="android.intent.category.DEFAULT" />

                          <category
                              android:name="android.intent.category.BROWSABLE" />

                          <data
                              android:mimeType="model/gltf-binary" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # 14. STRINGS
      # ============================================================
      - name: Write strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  PIFuHDC 3D Viewer
              </string>

          </resources>
          EOF


      # ============================================================
      # 15. STYLES
      # ============================================================
      - name: Write styles.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF


      # ============================================================
      # 16. PROGUARD
      # ============================================================
      - name: Write proguard-rules.pro
        shell: bash
        run: |
          cat > app/proguard-rules.pro <<'EOF'
          # PIFuHDC 3D Viewer
          EOF


      # ============================================================
      # 17. MAIN ACTIVITY
      # ============================================================
      - name: Write MainActivity.kt
        shell: bash
        run: |
          cat > app/src/main/java/com/pifuhdc/viewer/MainActivity.kt <<'EOF'
          package com.pifuhdc.viewer

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.Choreographer
          import android.view.TextureView
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          import com.google.android.filament.utils.ModelViewer

          import java.nio.ByteBuffer


          class MainActivity : Activity() {

              private lateinit var modelViewer: ModelViewer

              private lateinit var statusText: TextView

              private val choreographer =
                  Choreographer.getInstance()


              private val frameCallback =
                  object : Choreographer.FrameCallback {

                      override fun doFrame(
                          frameTimeNanos: Long
                      ) {

                          if (::modelViewer.isInitialized) {

                              modelViewer.render(
                                  frameTimeNanos
                              )
                          }

                          choreographer.postFrameCallback(
                              this
                          )
                      }
                  }


              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(
                      savedInstanceState
                  )

                  createViewerUi()

                  handleIntent(intent)
              }


              private fun createViewerUi() {

                  val root =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL
                      }


                  val controls =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.HORIZONTAL

                          setPadding(
                              16,
                              12,
                              16,
                              12
                          )
                      }


                  val openButton =
                      Button(this).apply {

                          text = "Open GLB"

                          setOnClickListener {
                              openGlbPicker()
                          }
                      }


                  statusText =
                      TextView(this).apply {

                          text =
                              "No GLB model loaded"

                          setPadding(
                              16,
                              0,
                              8,
                              0
                          )
                      }


                  controls.addView(
                      openButton,
                      LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1f
                      )
                  )


                  controls.addView(
                      statusText,
                      LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          2f
                      )
                  )


                  val textureView =
                      TextureView(this)


                  modelViewer =
                      ModelViewer(
                          textureView
                      )


                  textureView.setOnTouchListener(
                      modelViewer
                  )


                  root.addView(
                      controls,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )


                  root.addView(
                      textureView,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )


                  setContentView(root)
              }


              override fun onResume() {

                  super.onResume()

                  choreographer.postFrameCallback(
                      frameCallback
                  )
              }


              override fun onPause() {

                  choreographer.removeFrameCallback(
                      frameCallback
                  )

                  super.onPause()
              }


              override fun onDestroy() {

                  choreographer.removeFrameCallback(
                      frameCallback
                  )

                  if (::modelViewer.isInitialized) {
                      modelViewer.destroy()
                  }

                  super.onDestroy()
              }


              override fun onNewIntent(
                  intent: Intent?
              ) {

                  super.onNewIntent(intent)

                  if (intent != null) {

                      setIntent(intent)

                      handleIntent(intent)
                  }
              }


              private fun openGlbPicker() {

                  val intent =
                      Intent(
                          Intent.ACTION_OPEN_DOCUMENT
                      ).apply {

                          addCategory(
                              Intent.CATEGORY_OPENABLE
                          )

                          type = "*/*"

                          putExtra(
                              Intent.EXTRA_MIME_TYPES,
                              arrayOf(
                                  "model/gltf-binary",
                                  "application/octet-stream"
                              )
                          )
                      }


                  startActivityForResult(
                      intent,
                      REQUEST_GLB
                  )
              }


              @Deprecated("Bootstrap 2")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )


                  if (
                      requestCode ==
                          REQUEST_GLB
                      &&
                      resultCode ==
                          RESULT_OK
                  ) {

                      data?.data?.let {
                          loadGlb(it)
                      }
                  }
              }


              private fun handleIntent(
                  intent: Intent
              ) {

                  if (
                      intent.action ==
                          Intent.ACTION_VIEW
                      &&
                      intent.data != null
                  ) {

                      loadGlb(
                          intent.data!!
                      )
                  }
              }


              private fun loadGlb(
                  uri: Uri
              ) {

                  try {

                      statusText.text =
                          "Reading GLB..."


                      val bytes =
                          contentResolver
                              .openInputStream(uri)
                              ?.use {
                                  it.readBytes()
                              }
                              ?: throw IllegalStateException(
                                  "Unable to open GLB"
                              )


                      if (bytes.size < 12) {

                          throw IllegalArgumentException(
                              "File too small"
                          )
                      }


                      val magic =
                          String(
                              bytes,
                              0,
                              4,
                              Charsets.US_ASCII
                          )


                      if (magic != "glTF") {

                          throw IllegalArgumentException(
                              "Not a valid GLB file"
                          )
                      }


                      val sizeMb =
                          bytes.size / 1024 / 1024


                      statusText.text =
                          "Loading ${sizeMb} MB GLB..."


                      modelViewer.loadModelGlb(
                          ByteBuffer.wrap(bytes)
                      )


                      modelViewer.transformToUnitCube()


                      statusText.text =
                          "GLB loaded • Rotate / zoom"


                  } catch (e: Exception) {

                      statusText.text =
                          "GLB load failed"


                      Toast.makeText(
                          this,
                          "Could not load GLB: ${e.message}",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }


              companion object {

                  private const val REQUEST_GLB =
                      7001
              }
          }
          EOF


      # ============================================================
      # 18. PLACEHOLDER FILES
      # ============================================================
      - name: Create placeholder files
        shell: bash
        run: |
          touch app/src/main/assets/models/.gitkeep
          touch app/src/main/assets/sample/.gitkeep
          touch app/src/main/cpp/.gitkeep


      # ============================================================
      # 19. GENERATE GRADLE WRAPPER
      # ============================================================
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 9.5

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper generated."


      # ============================================================
      # 20. VERIFY PROJECT
      # ============================================================
      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "Project files:"
          find . \
            -maxdepth 6 \
            -type f \
            -not -path "./.git/*" \
            | sort

          echo ""
          echo "Android SDK:"
          ls -ld "$ANDROID_HOME/platforms/android-37"

          echo ""
          echo "Filament:"
          ls -lh app/libs/


      # ============================================================
      # 21. BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon


      # ============================================================
      # 22. CHECK APK
      # ============================================================
      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo ""
          echo "=========================================="
          echo "APK BUILD SUCCESS"
          echo "=========================================="

          ls -lh "$APK"


      # ============================================================
      # 23. UPLOAD APK
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PIFuHDC-3D-Viewer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # ============================================================
      # 24. COMMIT PROJECT
      # ============================================================
      - name: Commit Bootstrap 2 project
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then

              echo "No changes to commit."

          else

              git commit \
                -m "Bootstrap Android GLB viewer"

              git push

          fi
