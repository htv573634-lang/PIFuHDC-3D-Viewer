name: Bootstrap 2 - PIFuHDC 3D Viewer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap2:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # ============================================================
      # INSTALL REQUIRED ANDROID SDK PACKAGES
      # API 37 package is android-37.0
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which sdkmanager
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

          echo ""
          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo ""
          echo "Checking Android 37:"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

          echo "Android 37.0 SDK OK"

      # ============================================================
      # FILAMENT 1.77.0
      # ============================================================
      - name: Download Filament 1.77.0 AARs
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADING FILAMENT 1.77.0"
          echo "=========================================="

          mkdir -p app/libs

          curl -L --fail --retry 3 \
            -o app/libs/filament.aar \
            https://github.com/google/filament/releases/download/v1.77.0/filament-v1.77.0-android.aar

          curl -L --fail --retry 3 \
            -o app/libs/gltfio.aar \
            https://github.com/google/filament/releases/download/v1.77.0/gltfio-v1.77.0-android.aar

          curl -L --fail --retry 3 \
            -o app/libs/filament-utils-api.aar \
            https://github.com/google/filament/releases/download/v1.77.0/filament-utils-v1.77.0-android.aar

          echo ""
          echo "Filament files:"
          ls -lh app/libs

      # ============================================================
      # CREATE PROJECT DIRECTORIES
      # ============================================================
      - name: Create project structure
        shell: bash
        run: |
          set -e

          mkdir -p \
            app/src/main/java/com/pifuhdc/viewer \
            app/src/main/res/values \
            app/src/main/assets/models \
            app/src/main/assets/sample \
            app/src/main/cpp \
            gradle/wrapper

      # ============================================================
      # ROOT BUILD FILE
      # ============================================================
      - name: Create root build.gradle.kts
        shell: bash
        run: |
          cat > build.gradle.kts <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }

              dependencies {
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20")
              }
          }

          plugins {
              id("com.android.application") version "9.3.3" apply false
          }
          EOF

      # ============================================================
      # SETTINGS
      # ============================================================
      - name: Create settings.gradle.kts
        shell: bash
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PIFuHDC-3D-Viewer"

          include(":app")
          EOF

      # ============================================================
      # GRADLE PROPERTIES
      # ============================================================
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # ============================================================
      # APP BUILD FILE
      #
      # IMPORTANT:
      # No MainActivity is created by this bootstrap.
      # ============================================================
      - name: Create app/build.gradle.kts
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.pifuhdc.viewer"

              compileSdk = 37
              compileSdkMinor = 0

              defaultConfig {
                  applicationId = "com.pifuhdc.viewer"

                  minSdk = 26
                  targetSdk = 37

                  versionCode = 3
                  versionName = "0.3.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }

                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }

                  resources {
                      excludes += setOf(
                          "META-INF/AL2.0",
                          "META-INF/LGPL2.1",
                          "META-INF/*.version"
                      )
                  }
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          dependencies {
              implementation(files("libs/filament.aar"))
              implementation(files("libs/gltfio.aar"))
              implementation(files("libs/filament-utils-api.aar"))
          }
          EOF

      # ============================================================
      # MANIFEST
      #
      # MainActivity is declared for the final viewer, but this
      # bootstrap deliberately does NOT create MainActivity.kt.
      # ============================================================
      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.opengles.aep"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />

                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />

                          <data android:mimeType="model/gltf-binary" />
                          <data android:mimeType="application/octet-stream" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ============================================================
      # STRINGS
      # ============================================================
      - name: Create strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">PIFuHDC 3D Viewer</string>
          </resources>
          EOF

      # ============================================================
      # STYLES
      # ============================================================
      - name: Create styles.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#666666</item>

              </style>

          </resources>
          EOF

      # ============================================================
      # IMPORTANT:
      # NO MainActivity.kt HERE
      # ============================================================
      - name: Verify MainActivity is intentionally absent
        shell: bash
        run: |
          set -e

          if [ -f app/src/main/java/com/pifuhdc/viewer/MainActivity.kt ]; then
            echo "ERROR: MainActivity.kt exists."
            echo "Bootstrap 2 must not create MainActivity.kt."
            exit 1
          fi

          echo "MainActivity.kt is intentionally absent."

      # ============================================================
      # GENERATE GRADLE WRAPPER
      # ============================================================
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GENERATING GRADLE WRAPPER"
          echo "=========================================="

          gradle --version

          gradle wrapper \
            --gradle-version 9.5.1 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # VERIFY PROJECT FILES
      # ============================================================
      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT TREE"
          echo "=========================================="

          find . \
            -maxdepth 5 \
            -type f \
            ! -path "./.git/*" \
            | sort

          echo ""
          echo "Checking critical files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/values/styles.xml

          test -f app/libs/filament.aar
          test -f app/libs/gltfio.aar
          test -f app/libs/filament-utils-api.aar

          test ! -f app/src/main/java/com/pifuhdc/viewer/MainActivity.kt

          echo ""
          echo "All bootstrap files verified."

      # ============================================================
      # CLEAN
      # ============================================================
      - name: Clean Gradle project
        shell: bash
        run: |
          set -e
          ./gradlew clean --no-daemon

      # ============================================================
      # BUILD DEBUG APK
      #
      # There is intentionally no Kotlin source yet.
      # This tests the complete Gradle + AGP + SDK + Filament
      # configuration independently from MainActivity.
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING PIFuHDC 3D VIEWER"
          echo "WITHOUT MAINACTIVITY"
          echo "=========================================="

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APK RESULT"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PIFuHDC-3D-Viewer-debug-bootstrap
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ============================================================
      # COMMIT GENERATED PROJECT
      # ============================================================
      - name: Commit generated project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Bootstrap 2: Android GLB viewer project without MainActivity"
            git push
          fi
