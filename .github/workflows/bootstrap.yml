name: Bootstrap Project Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create project structure
        shell: bash
        run: |
          set -e

          mkdir -p .github/workflows

          mkdir -p app/src/main/java/com/pifuhdc/viewer
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets/models
          mkdir -p app/src/main/assets/sample
          mkdir -p app/src/main/cpp

          mkdir -p gradle/wrapper

          touch app/src/main/java/com/pifuhdc/viewer/MainActivity.kt
          touch app/src/main/AndroidManifest.xml
          touch app/src/main/res/values/styles.xml
          touch app/src/main/res/values/strings.xml
          touch app/build.gradle.kts
          touch build.gradle.kts
          touch settings.gradle.kts
          touch gradle.properties
          touch gradle/wrapper/gradle-wrapper.properties
          touch gradlew
          touch gradlew.bat
          touch .gitignore
          touch README.md

      - name: Show tree
        run: |
          find . -maxdepth 4 | sort

      - name: Commit structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Bootstrap Android project structure"
            git push
          fi
